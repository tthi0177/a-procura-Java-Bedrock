name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps

      - name: Gerar projeto Android nativo
        env:
          CI: 1
        run: |
          npx expo prebuild --platform android --clean --no-install || npx expo run:android --no-build-cache || true

      - name: Criar projeto Android caso necessário e Compilar APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            echo "Tentando compilar via EAS local..."
            npx eas-cli build --platform android --profile preview --local --output ./app-release.apk || true
          fi

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: A-Procura-Java-Bedrock-v1.1.0
          path: |
            android/app/build/outputs/apk/**/*.apk
            *.apk