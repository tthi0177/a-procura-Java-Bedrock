name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps

      - name: Gerar projeto Android nativo
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: |
          npx --yes expo prebuild --platform android --clean --no-install || true

      - name: Compilar APK Android
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: A-Procura-Java-Bedrock-v1.1.0
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk 